
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>עמדות סריקת שבבים לכלבים בישראל</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f9f6;
      color: #24362b;
    }
    header {
      background: #e2eee4;
      text-align: center;
      padding: 28px 15px;
    }
    h1 { font-size: 25px; margin: 0 0 12px; }
    p { line-height: 1.6; margin: 0; }
    .info {
      text-align: center;
      padding: 14px;
      font-size: 15px;
    }
    #map {
      width: 100%;
      height: 65vh;
      min-height: 350px;
      z-index: 1;
    }
    .station { line-height: 1.8; min-width: 190px; }
    .station a {
      display: inline-block;
      background: #366b4c;
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 10px;
    }
    footer {
      text-align: center;
      padding: 22px 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <h1>🐾 עמדות סריקת שבבים</h1>
  <p>מצאתם כלב? מצאו עמדת סריקה קרובה אליכם, ללא עלות.</p>
</header>

<div class="info">
  📍 לחצו על הסימון במפה לפרטים ולניווט לעמדה
</div>

<div id="map"></div>

<footer>
  ביחד עוזרים לכלבים לחזור הביתה 🤍
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const stations = [
    {
      name: "עמדת סריקת שבבים – בית אליעזר",
      address: "בית אליעזר, חדרה",
      lat: 32.4270709,
      lng: 34.9541563,
      hours: "זמינה 24 שעות ביממה",
      price: "ללא עלות"
    }
  ];

  const map = L.map('map').setView(
    [32.4270709, 34.9541563], 15
  );

  L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }
  ).addTo(map);

  stations.forEach(station => {
    const marker = L.marker([
      station.lat,
      station.lng
    ]).addTo(map);

    const box = document.createElement('div');
    box.className = 'station';

    const title = document.createElement('strong');
    title.textContent = '🐾 ' + station.name;

    const address = document.createElement('p');
    address.textContent = '📍 ' + station.address;

    const hours = document.createElement('p');
    hours.textContent = '🕒 ' + station.hours;

    const price = document.createElement('p');
    price.textContent = '🤍 ' + station.price;

    const link = document.createElement('a');
    link.href =
      'https://www.google.com/maps/dir/?api=1&destination='
      + station.lat + ',' + station.lng;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = '📍 ניווט לעמדה';

    box.append(title, address, hours, price, link);
    marker.bindPopup(box);
  });

  if (stations.length === 1) {
    map.eachLayer(layer => {
      if (layer instanceof L.Marker) {
        layer.openPopup();
      }
    });
  }
</script>

</body>
</html>
