
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>עמדות סריקת שבבים לכלבים</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f7f9f6; }
    header { padding: 22px 16px; text-align: center; background: #e2eee4; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { margin: 0; line-height: 1.6; }
    #map { height: 70vh; width: 100%; }
    footer { text-align: center; padding: 18px; font-size: 14px; }
    button { padding: 10px; border: 0; border-radius: 8px; background: #366b4c; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>🐾 עמדות סריקת שבבים</h1>
    <p>מוצאים כלב? מצאו עמדת סריקה קרובה אליכם, ללא עלות.</p>
  </header>
  <div id="map"></div>
  <footer>ביחד עוזרים לכלבים לחזור הביתה 🤍</footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([31.8, 34.9], 8);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // כאן נוסיף עמדות אמיתיות אחרי שנאמת את כתובותיהן.
    const stations = [];

    stations.forEach(station => {
      const marker = L.marker([station.lat, station.lng]).addTo(map);
      const box = document.createElement('div');
      const title = document.createElement('strong');
      title.textContent = station.name;
      const address = document.createElement('p');
      address.textContent = station.address;
      const link = document.createElement('a');
      link.href = 'https://www.google.com/maps/dir/?api=1&destination=' +
        encodeURIComponent(station.lat + ',' + station.lng);
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = '📍 ניווט לעמדה';
      box.append(title, address, link);
      marker.bindPopup(box);
    });
  </script>
</body>
</html>
